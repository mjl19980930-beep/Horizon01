name: AI Topic Collector to Feishu

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "抓取最近多少小时"
        required: false
        default: "24"
      limit:
        description: "最多写入多少条"
        required: false
        default: "20"
  schedule:
    - cron: "30 1 * * *"
    - cron: "30 7 * * *"

permissions:
  contents: write

jobs:
  collect-and-write:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect AI topics and write to Feishu
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN_FOR_HORIZON || github.token }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_WIKI_TOKEN: ${{ secrets.FEISHU_WIKI_TOKEN }}
          FEISHU_BITABLE_APP_TOKEN: ${{ secrets.FEISHU_BITABLE_APP_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
          FEISHU_AUTO_CREATE_FIELDS: "true"
        run: |
          python scripts/run_topic_collector.py \
            --hours "${{ github.event.inputs.hours || '24' }}" \
            --limit "${{ github.event.inputs.limit || '20' }}"

      - name: Save run state and preview
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .state outputs || true
          git diff --cached --quiet || git commit -m "chore: update AI topic collector run state"
          git push || true
